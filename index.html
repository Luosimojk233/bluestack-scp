<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="蓝栈 SCP：秘密实验室服务器公告、功能介绍与积分规则。BlueStack SCP: Secret Laboratory server information and score rules.">

    <title>蓝栈 SCP：秘密实验室</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            color: #e8f1f8;

            font-family:
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    rgba(31, 97, 141, 0.55),
                    transparent 45%
                ),
                linear-gradient(
                    145deg,
                    #050b12,
                    #0b1827 50%,
                    #07101a
                );
        }

        .panel {
            width: min(700px, 100%);
            padding: 48px 30px;
            text-align: center;

            background: rgba(15, 29, 45, 0.95);
            border: 1px solid rgba(79, 195, 247, 0.3);
            border-radius: 20px;

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin: 0;
            color: #4fc3f7;
            font-size: clamp(29px, 6vw, 43px);
        }

        .subtitle {
            margin: 10px 0 0;
            color: #b0bec5;
            font-size: 19px;
        }

        .description {
            margin: 28px 0;
            color: #d5e4ed;
            line-height: 1.8;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 16px;
        }

        .button {
            display: block;
            padding: 17px 20px;

            color: #07111a;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;

            background: #4fc3f7;
            border-radius: 12px;

            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .button.english {
            background: #ffd54f;
        }

        .button:hover {
            filter: brightness(1.1);
            transform: translateY(-3px);
        }

        .contact {
            margin-top: 28px;
            padding-top: 20px;

            border-top:
                1px solid rgba(79, 195, 247, 0.2);
        }

        .contact a {
            margin: 0 8px;
            color: #81d4fa;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        footer {
            margin-top: 25px;
            color: #78909c;
            font-size: 14px;
        }
    </style>
</head>

<body>
<main class="panel">
    <h1>蓝栈 SCP：秘密实验室</h1>

    <p class="subtitle">
        BlueStack SCP: Secret Laboratory
    </p>

    <p class="description">
        服务器公告、功能介绍、积分规则与常用指令<br>
        Server information, features, score rules, and commands
    </p>

    <p class="description">
        请选择语言<br>
        Please select your language
    </p>

    <div class="buttons">
        <a class="button" href="zh.html">
            中文公告
        </a>

        <a class="button english" href="en.html">
            English Announcement
        </a>
    </div>

    <div class="contact">
        <a
            href="https://discord.gg/d2HPvuf8E"
            target="_blank"
            rel="noopener noreferrer">
            Discord
        </a>

        <a href="mailto:thecitydreams@foxmail.com">
            Email
        </a>
    </div>

    <footer>
        BlueStack SCP: Secret Laboratory
    </footer>
</main>
</body>
</html>
